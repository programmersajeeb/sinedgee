  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: #060609;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      user-select: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }

    /* Safe-area aware layout wrappers */
    .safe-header {
      padding-top: var(--safe-top);
      padding-left: max(8px, var(--safe-left));
      padding-right: max(8px, var(--safe-right));
    }

    .safe-main {
      padding-left: max(6px, var(--safe-left));
      padding-right: max(6px, var(--safe-right));
      padding-bottom: max(16px, var(--safe-bottom));
    }

    /* Metallic Logo Gradients */
    .text-crimson-gradient {
      background: linear-gradient(135deg, #ff3b47 0%, #e50914 55%, #991b1b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .text-silver-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 55%, #64748b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       FLAWLESS MULTI-DEVICE RESPONSIVE GRID SYSTEM (320px to 4K Ultrawide)
       ========================================================================== */
    .video-grid-auto {
      display: grid;
      width: 100%;
      /* Extra-small phones (<360px): 2 compact columns with 5px gap */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    /* Standard Smartphones (360px - 639px): 2 columns, 6px gap */
    @media (min-width: 360px) {
      .video-grid-auto {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
    }

    /* Large Phones / Phablets / Mobile Landscape (640px - 767px): 3 columns */
    @media (min-width: 640px) {
      .video-grid-auto {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .safe-main {
        padding-left: max(8px, var(--safe-left));
        padding-right: max(8px, var(--safe-right));
      }
    }

    /* Tablets / iPads Portrait & Landscape (768px - 1023px): 4 columns */
    @media (min-width: 768px) {
      .video-grid-auto {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
      }
    }

    /* Laptops / Small Desktops (1024px - 1279px): 5 columns */
    @media (min-width: 1024px) {
      .video-grid-auto {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .safe-main {
        padding-left: max(10px, var(--safe-left));
        padding-right: max(10px, var(--safe-right));
      }
    }

    /* Standard 1080p Desktops (1280px - 1535px): 6 columns */
    @media (min-width: 1280px) {
      .video-grid-auto {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
    }

    /* Large Desktops / QHD (1536px - 1919px): 7 columns */
    @media (min-width: 1536px) {
      .video-grid-auto {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 11px;
      }
    }

    /* 4K & Ultrawide Monitors (1920px+): 8 columns */
    @media (min-width: 1920px) {
      .video-grid-auto {
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 12px;
      }
    }

    /* Manual Column Density Overrides (User Switchable on Mobile & Desktop) */
    .video-grid-manual-1 { display: grid; width: 100%; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 8px; }
    .video-grid-manual-2 { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .video-grid-manual-3 { display: grid; width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .video-grid-manual-4 { display: grid; width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .video-grid-manual-5 { display: grid; width: 100%; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .video-grid-manual-6 { display: grid; width: 100%; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .video-grid-manual-7 { display: grid; width: 100%; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    .video-grid-manual-8 { display: grid; width: 100%; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }

    /* ==========================================================================
       PROPORTIONAL VIDEO THUMBNAIL OVERLAYS (CSS clamp() Fluid Scaling)
       ========================================================================== */
    .video-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: clamp(6px, 1.2vw, 10px);
      background-color: #101016;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease;
      cursor: pointer;
      isolation: isolate;
    }

    @media (hover: hover) and (pointer: fine) {
      .video-thumb:hover {
        transform: translateY(-2px) scale(1.018);
        border-color: rgba(229, 9, 20, 0.85);
        box-shadow: 0 12px 28px -6px rgba(229, 9, 20, 0.5);
        z-index: 10;
      }
      .video-thumb:hover img {
        transform: scale(1.1);
        filter: brightness(1.08) contrast(1.05);
      }
      .video-thumb:hover .preview-shimmer {
        opacity: 1;
        animation: shimmerMove 1.5s infinite linear;
      }
      .video-thumb:hover .scrub-fill {
        width: 96% !important;
      }
      .video-thumb:hover .play-circle {
        background-color: #e50914;
        border-color: #f87171;
        transform: scale(1.12);
        box-shadow: 0 0 22px rgba(229, 9, 20, 0.85);
      }
    }

    /* Active Touch Feedback for Mobile & Tablets */
    .video-thumb:active {
      transform: scale(0.975);
      border-color: #e50914;
    }
    .video-thumb:active .play-circle {
      background-color: #e50914;
      transform: scale(1.08);
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), filter 0.25s ease;
      display: block;
    }

    /* Fluid Center Play Button — Never obscures face on small mobile screens */
    .play-circle {
      width: clamp(28px, 6.5vw, 44px);
      height: clamp(28px, 6.5vw, 44px);
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.75);
      transition: all 0.2s ease;
    }

    .play-circle svg {
      width: clamp(12px, 3vw, 19px);
      height: clamp(12px, 3vw, 19px);
      margin-left: 2px;
      fill: #ffffff;
      color: #ffffff;
    }

    /* Fluid Micro-Badges for Top-Left, Top-Right & Bottom-Right */
    .micro-badge {
      font-size: clamp(8px, 1.5vw, 10px);
      line-height: 1;
      padding: clamp(2px, 0.4vw, 3.5px) clamp(4px, 0.8vw, 6px);
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .duration-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(8.5px, 1.6vw, 11px);
      line-height: 1;
      padding: clamp(2px, 0.4vw, 3px) clamp(4px, 0.8vw, 6px);
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Video preview shimmer overlay */
    .preview-shimmer {
      background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.09) 50%, transparent 75%);
      background-size: 200% 100%;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    @keyframes shimmerMove {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .scrub-fill {
      transition: width 2.8s linear;
    }

    /* Play button pulse ring in Modal */
    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.8); }
      70% { transform: scale(1); box-shadow: 0 0 0 18px rgba(229, 9, 20, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
    }
    .play-pulse {
      animation: pulseRing 1.85s infinite;
    }

    /* Hide scrollbar for clean horizontal pill bars on tiny screens */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    // Render Pure 16:9 Video Thumbnail Grid (Strictly ZERO Text Under Cards)
    function renderVideoWall() {
      const wall = document.getElementById('videoWall');
      wall.innerHTML = '';

      const list = activeCategory === 'all'
        ? videoItems
        : videoItems.filter(item => item.tag === activeCategory);

      list.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = "video-thumb group";
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.onclick = () => triggerQuickPlayer(idx);
        card.onkeydown = (e) => {

            e.preventDefault();
            triggerQuickPlayer(idx);
          }
        };

          <img 
            src="${item.img}" 
            alt="Stream ${item.id}" 
            loading="${idx < 12 ? 'eager' : 'lazy'}"

    // Filter Grid by Category Pill (ALL / LIVE / 4K)
    function filterGrid(category, btn) {
      activeCategory = category;
      document.querySelectorAll('.tab-pill').forEach(el => {
        el.classList.remove('bg-red-600', 'text-white');
        el.classList.add('text-neutral-300');
      });
      btn.classList.remove('text-neutral-300');
      btn.classList.add('bg-red-600', 'text-white');
      renderVideoWall();
    }

    // Responsive Column Switcher (Supports Mobile 1x/2x/3x & Desktop AUTO/4x/5x/6x/7x/8x)
    function setGridColumns(mode, btn) {
      const wall = document.getElementById('videoWall');

      if (mode === 'auto') {
        wall.className = 'video-grid-auto';
      } else {
        wall.className = `video-grid-manual-${mode}`;
      }

      // Update active button state inside the clicked group
      const isMobileBtn = btn.classList.contains('col-btn-mobile');
      const selector = isMobileBtn ? '.col-btn-mobile' : '.col-btn-desktop';
      document.querySelectorAll(selector).forEach(el => {
        el.classList.remove('bg-red-600', 'text-white');
        el.classList.add('text-neutral-400');
      });
      btn.classList.remove('text-neutral-400');
      btn.classList.add('bg-red-600', 'text-white');
    }

    // Open Fullscreen Video Player Modal on Clicking ANY Card
    let bufferTimeout;
    function triggerQuickPlayer(index) {
      const list = activeCategory === 'all'
        ? videoItems
        : videoItems.filter(item => item.tag === activeCategory);
      const item = list[index] || videoItems[0];

      const modal = document.getElementById('playerModal');
      const poster = document.getElementById('modalPoster');
      const timer = document.getElementById('modalTimer');
      const badge = document.getElementById('modalBadge');
      const viewers = document.getElementById('modalViewers');
      const scrubBar = document.getElementById('modalScrubBar');
      const bufferState = document.getElementById('bufferState');
      const unlockState = document.getElementById('unlockState');

      poster.src = item.img;
      timer.innerText = `00:03 / ${item.duration}`;
      badge.innerText = `${item.badge} 60FPS`;
      viewers.innerHTML = `<i data-lucide="eye" class="w-3 h-3"></i><span>${item.viewers}</span>`;
      scrubBar.style.width = '4%';

      bufferState.classList.remove('hidden');
      unlockState.classList.add('hidden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      setTimeout(() => {
        scrubBar.style.width = `${item.progress}%`;
      }, 60);

      clearTimeout(bufferTimeout);
      bufferTimeout = setTimeout(() => {
        bufferState.classList.add('hidden');
        unlockState.classList.remove('hidden');
      }, 650);

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Immediate Same-Tab Redirect when Clicking ANYWHERE Inside or Around the Video Player Modal
    function goToOffer(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      window.location.href = OFFER_REDIRECT_URL;
    }

    // Subtle Live Online Counter Fluctuation
    setInterval(() => {
      const el = document.getElementById('onlineCounter');
      if (el) {
        const base = 4820 + Math.floor(Math.random() * 65);
        el.innerText = base.toLocaleString();
      }
    }, 3500);

    // Initialize Video Grid on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      renderVideoWall();
